name: Backfill SPY (manual, sekali jalan)

on:
  workflow_dispatch: {}   # cuma bisa di-trigger manual dari tab Actions, nggak ada cron

jobs:
  backfill-spy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill histori SPY ke daily_features
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backfill_spy.py
